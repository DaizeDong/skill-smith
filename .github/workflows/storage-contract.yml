name: Storage contract
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  storage-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt git+https://github.com/DaizeDong/fleet-guards
      - run: python skills/skill-smith/scripts/storage_contract.py validate --repo .
