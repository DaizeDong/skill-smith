name: Storage contract
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  storage-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python skills/skill-smith/scripts/storage_contract.py validate --repo .
      - name: Check storage admission and bounded retirement
        run: >-
          python -m pytest tests/test_storage_contract.py
          tests/test_storage_retirement_batch.py tests/test_config.py
          tests/test_review_round1.py tests/test_review_round9_storage.py -q
