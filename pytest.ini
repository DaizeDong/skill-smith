[pytest]
# `python -m pytest -q` from the repo root, the invocation every test file's docstring names, has
# been failing at COLLECTION since commit c1a790d, so the whole suite has been unrunnable rather
# than merely red. Two files are named test_pii_guard.py: the real one at tools/, and a VENDORED
# copy under skills/skill-smith/assets/pii-guard/ that the scaffolder stamps into a newly created
# repo. Neither directory is a package, so pytest derives the same module name for both and aborts
# with "import file mismatch".
#
# The assets tree is a payload, not this repo's test suite. Its copy is exercised where it lands,
# in the repo the scaffolder creates. Ignore it here.
#
# Same class of rot as the one fleet_check.py exists to catch: a gate that was correct, documented,
# and never actually executed.
addopts = --ignore=skills/skill-smith/assets
testpaths = tests tools
