[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-smith"
version = "0.1.4"
description = "Read-only skill and plugin source catalog"
requires-python = ">=3.10"
dependencies = ["fleet-guards>=0.1.0"]

[project.scripts]
skill-smith-catalog = "skill_smith.__main__:main"

[tool.setuptools.packages.find]
where = ["skills/skill-smith/scripts"]
include = ["skill_smith*"]
